name: Deploy Python AI to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'backend/ai/**'
      - '.github/workflows/azure-ai-deploy.yml'

env:
  AZURE_WEBAPP_NAME: satutani-ai
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Zip artifact for deployment
      working-directory: backend/ai
      run: zip -r release.zip . -x "*.git*" "__pycache__/*"

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_AI }}
        package: backend/ai/release.zip
