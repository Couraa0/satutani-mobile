name: Deploy NestJS API to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'backend/api/**'
      - '.github/workflows/azure-api-deploy.yml'

env:
  AZURE_WEBAPP_NAME: satutani-api
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Zip source code for deployment
      working-directory: backend/api
      run: |
        zip -r release.zip . \
          -x "node_modules/*" \
          -x "dist/*" \
          -x "coverage/*" \
          -x "test/*" \
          -x "*.log" \
          -x ".env" \
          -x ".git*"
        echo "ZIP size: $(du -h release.zip | cut -f1)"

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
        package: backend/api/release.zip